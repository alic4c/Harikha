<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; img-src 'self' https: data:; style-src 'self' https: 'unsafe-inline'; script-src 'self' https: 'unsafe-inline'; font-src 'self' https: data:; connect-src 'self' https:; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://maps.google.com https://www.google.com; upgrade-insecure-requests;">
<meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الصفحة غير موجودة - حركها</title>
  <link rel="icon" type="image/png" href="images/logo-harekha.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #1490DA 0%, #3FA9E8 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      direction: rtl;
    }
    .error-container { padding: 40px; }
    .error-code { font-size: 120px; font-weight: 700; margin: 0; line-height: 1; }
    .error-text { font-size: 24px; margin: 10px 0 30px; }
    .home-btn {
      display: inline-block;
      background: #fff;
      color: #1490DA;
      padding: 14px 40px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 18px;
      transition: all 0.3s ease;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }
    .home-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
  </style>
</head>
<body>
  <div class="error-container">
    <h1 class="error-code">404</h1>
    <p class="error-text">عذراً، الصفحة التي تبحث عنها غير موجودة</p>
    <a href="index.html" class="home-btn">العودة إلى الرئيسية</a>
  </div>
</body>
</html>
